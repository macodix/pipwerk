[project]
name = "pipwerk-relaycore"
version = "0.1.0"
description = "Message library of pipwerk relay: address, message, envelope with check value and transmission ways as extensions"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.5",
]

[project.scripts]
pipwerk-relaycore-schemas = "pipwerk_relaycore.schemas:main"

[project.entry-points."pipwerk_relay.ways"]
files = "pipwerk_relaycore.ways.files:FilesWay"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pipwerk-relay-testway",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv.sources]
pipwerk-relay-testway = { path = "tests/packages/pipwerk-relay-testway" }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipwerk_relaycore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tests/packages/*/build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
