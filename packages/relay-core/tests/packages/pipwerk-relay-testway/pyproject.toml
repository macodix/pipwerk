[project]
name = "pipwerk-relay-testway"
version = "0.1.0"
description = "Test way of the tests of pipwerk_relaycore: a way from its own package, loaded through its entry point"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "pipwerk-relaycore",
]

[project.entry-points."pipwerk_relay.ways"]
memory = "pipwerk_relay_testway:MemoryWay"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipwerk_relay_testway"]

[tool.uv.sources]
pipwerk-relaycore = { path = "../../..", editable = true }
