# Hält das Referenz-Repository auf dem Entwicklungsrechner auf dem Stand von main.
# Beschreibung: dev-werk, de/process/development-process.md (Mechanismus des Entwicklungsrechners).
# Bewusst ohne Auslöser für Pull Requests: Änderungsvorschläge Dritter dürfen
# keinen Code auf dem Entwicklungsrechner ausführen.
name: sync-repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-repo
  cancel-in-progress: true

jobs:
  sync-repo:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Referenz-Repository aktualisieren
        run: |
          repo=/srv/aixlab/dev/pipwerk/repo
          test "$(git -C "$repo" symbolic-ref --short HEAD)" = main
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" fetch --prune origin
          git -C "$repo" merge --ff-only origin/main
