[database]
# SQLAlchemy database URL for pipwerk replay's own persistent storage.
# pipwerk replay does not start without a startup configuration that defines it.
url = sqlite:///./pipwerk-replay.db

# Optional section and optional entries. The values below are the defaults,
# except allowed_hosts, which is given as an example.
# [server]
# Address and port the backend binds to (the command line parameters --host and
# --port override them).
# host = 127.0.0.1
# port = 8000
# Names and IP addresses that the Host header of a request may carry, in
# addition to 127.0.0.1, localhost and ::1 (protection against DNS rebinding). The
# entry *ip allows every IP address.
# allowed_hosts = replay.example, 192.0.2.7
# Largest request body in bytes (1024 to 1073741824).
# max_body_bytes = 2097152

# [marketdata]
# The data stock of historical price data. Optional section and optional entries; the
# values below are the defaults, except url, which is given as an example.
# The database of the data stock. Without it the data stock lives in the database of
# [database] (with its own tables and its own version table).
# url = sqlite:///./pipwerk-marketdata.db
# Largest size of one file of an import in bytes (1024 to 1073741824) and largest number of
# rows or entries in it (1 to 100000000).
# max_upload_bytes = 33554432
# max_rows = 500000
# Largest number of files of one import (1 to 1000) and largest total size of the files of one
# import in bytes (1024 to 4294967296, not smaller than max_upload_bytes; without an entry the
# larger of 268435456 and max_upload_bytes). The request body of an import may be this size plus
# the envelope of the form.
# max_files_per_import = 100
# max_import_bytes = 268435456
# Number of rejected rows an import lists in its result; all are counted (0 to 1000000).
# max_reported_rejections = 1000
# Number of imports that run at the same time (1 to 64); the next one is answered with 429.
# max_concurrent_imports = 2
# Largest number of items of a list in an answer: rows of the list of series, gaps, periods
# (1 to 1000000).
# max_listed_items = 1000
# Largest number of parts in one request for completeness (1 to 10000).
# max_parts_per_request = 100
