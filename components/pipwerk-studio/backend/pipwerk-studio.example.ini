[database]
# SQLAlchemy database URL for pipwerk Studio's own persistent storage.
# pipwerk Studio does not start without a startup configuration that defines it.
url = sqlite:///./pipwerk-studio.db

# Optional. Names and IP addresses that the Host header of a request may carry, in
# addition to 127.0.0.1, localhost and ::1 (protection against DNS rebinding). The
# entry *ip allows every IP address. Example:
# [server]
# allowed_hosts = studio.example, 192.0.2.7
