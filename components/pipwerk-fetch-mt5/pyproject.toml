[project]
name = "pipwerk-fetch-mt5"
version = "0.1.0.dev0"
description = "pipwerk-fetch-mt5: acquisition of historical market data from MetaTrader 5 over HTTP"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# The package MetaTrader5 runs on Windows only. Installation and tests on other systems
# work without it; the program needs it to talk to a real MetaTrader 5.
mt5 = [
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.scripts]
pipwerk-fetch-mt5 = "pipwerk_fetch_mt5.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipwerk_fetch_mt5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101: assert in tests; S104: the tests name 0.0.0.0 as a value, they bind nothing;
# S105 and S106: made-up keys and passwords of the tests, no real secrets
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
