# Startup configuration of pipwerk-fetch-mt5 (example).
#
# Copy this file under the name pipwerk-fetch-mt5.ini to one of the places below, fill in
# the two required entries (marked "required") and start the program. The program uses exactly
# one file; it takes the first one it finds in this order, or the one given with -c <PATH>:
#
#   -c <PATH>                                   (highest priority)
#   %USERPROFILE%\pipwerk\etc                   (Windows)
#   %APPDATA%\pipwerk
#   %PROGRAMDATA%\pipwerk
#
#   $HOME/pipwerk/etc                           (Linux)
#   $HOME/.config/pipwerk
#   /etc/pipwerk
#
# The file contains the shared key. Keep it in a place that only the user of the program can
# read, and never put the filled-in file into a repository. Lines that begin with # or ; are
# comments; a comment must stand on its own line.

[server]
# The address and the port the program listens on. The default 127.0.0.1 is reachable only from
# this machine. For pipwerk replay on another machine, give the address of this machine in the
# trusted network, or 0.0.0.0 for every address. Do not make the program reachable from outside
# the network you control: it reaches a machine with trading software.
host = 127.0.0.1
port = 8765

# Optional. The names and IP addresses a request may carry in its Host header, in addition to
# 127.0.0.1, localhost, ::1 and the address given as host above (protection against DNS
# rebinding). The entry *ip allows every IP address; it is the usual choice together with
# host = 0.0.0.0. Example:
# allowed_hosts = mt5-pc.example, 192.0.2.10

[security]
# required. The shared key: 16 to 256 printable characters without blanks. The same key stands
# in the startup configuration of pipwerk replay. Create one, for example, with
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
# The program does not start while this entry is empty.
shared_key =

[broker]
# required. The time zone of the server time of the broker, as an IANA name. MetaTrader 5
# delivers times in the server time of the broker; the program converts them to UTC with this
# zone, with summer time. Brokers often use Europe/Athens (UTC+2, summer time UTC+3) or
# Europe/Berlin. Look at the time of the market overview in MetaTrader 5 against UTC to check.
server_time_zone =

# Optional. The name of the broker as it stands in the delivered files. Without it the name of
# the trade server that MetaTrader 5 is connected to is used.
# name = Demo-Broker

# Optional. The largest number of rows of one answer (candles or ticks). A request for a longer
# period is answered with the error range_too_large. Default 50000, largest 1000000.
# max_rows_per_request = 50000

[metatrader5]
# Optional. Without these entries the program attaches to the MetaTrader 5 terminal that is
# running on this machine, with the account it is logged in to.
#
# The terminal program, if the program cannot find it (the path of terminal64.exe):
# path = C:\Program Files\MetaTrader 5\terminal64.exe
#
# A login of its own for the program (number of the account, its password and the trade
# server). The password stands in plain text in this file.
# login = 12345678
# password =
# server = Broker-Demo
#
# The time in milliseconds the program waits for the terminal. Default 60000.
# timeout_ms = 60000

[symbols]
# Optional. The table designation = symbol of the broker. pipwerk replay asks for an instrument
# by its designation, for example EURUSD; the broker may call it differently, for example
# EURUSD.r. Without an entry the designation itself is the symbol. Upper and lower case count.
# EURUSD = EURUSD.r
# DE40 = GER40.cash
