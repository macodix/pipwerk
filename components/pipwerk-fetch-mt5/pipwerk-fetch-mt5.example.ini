# Startup configuration of pipwerk-fetch-mt5 (example).
#
# Copy this file under the name pipwerk-fetch-mt5.ini to one of the places below, fill in
# the required entry (marked "required") and call the program. The program uses exactly one
# file; it takes the first one it finds in this order, or the one given with -c <PATH>:
#
#   -c <PATH>                                   (highest priority)
#   %USERPROFILE%\pipwerk\etc                   (Windows)
#   %APPDATA%\pipwerk
#   %PROGRAMDATA%\pipwerk
#
#   $HOME/pipwerk/etc                           (Linux)
#   $HOME/.config/pipwerk
#   /etc/pipwerk
#
# The program has no server and opens no port, so there is no host, port or list of hosts here.
# The commands "serve" and "request" talk to the relay of this machine through a directory or
# another transmission way; their part is the section [relay] at the end of this file. If you
# give a login for MetaTrader 5 below, the file holds a password: keep it in a place that only
# you can read, and never put the filled-in file into a repository. Lines that begin with # or ;
# are comments; a comment must stand on its own line.

[broker]
# required. The time zone of the server time of the trade server, as an IANA name. MetaTrader 5
# delivers times in the server time of the broker; the program converts them to UTC with this
# zone, with summer time. Brokers often use Europe/Athens (UTC+2, summer time UTC+3) or
# Europe/Berlin. Look at the time of the market overview in MetaTrader 5 against UTC to check.
# Once a year, where the clocks are put back, one hour of the server time occurs twice. The
# program leaves the second one out (and names it in its output). Ticks of that hour are
# recognised only if the market is dense enough; in a thin market rows of the second hour can
# arrive with a UTC time one hour too early and without a note. If the broker offers a server
# without summer time, use that server and its zone (for example Etc/GMT-2 for UTC+2 all year);
# otherwise do not fetch ticks across the change of the clocks.
server_time_zone =

# Optional. The largest number of rows of one file (candles or ticks). A call for a longer
# period fails for that part with the reason "Zeitraum zu groß"; choose a shorter period and
# call again. Default 200000, largest 5000000. The import of pipwerk replay takes files of up to
# 500000 rows and 32 MiB by default.
# max_rows_per_file = 200000

# Optional. The largest number of reads of MetaTrader 5 for one file. A long period is read
# in several steps (candles: 10000 bars each; ticks: 6 hours each). A call that needs more
# reads fails for that part, before the first read. Default 500 (about 125 days of ticks),
# largest 100000.
# max_reads_per_file = 500

[metatrader5]
# Optional. Without these entries the program attaches to the MetaTrader 5 terminal that is
# running on this machine, with the account it is logged in to. The name of the trade server
# of that account is the broker in every file.
#
# The terminal program, if the program cannot find it (the path of terminal64.exe):
# path = C:\Program Files\MetaTrader 5\terminal64.exe
#
# A login of its own for the program (number of the account, its password and the trade
# server). The password stands in plain text in this file.
# login = 12345678
# password =
# server = Broker-Demo
#
# The time in milliseconds the program waits for the terminal. Default 60000.
# timeout_ms = 60000

[symbols]
# Optional. The table designation = symbol of the broker. You name an instrument by its
# designation on the command line, for example EURUSD; the broker may call it differently, for
# example EURUSD.r. Without an entry the designation itself is the symbol. Upper and lower case
# count. The files always carry the designation, never the symbol of the broker.
# EURUSD = EURUSD.r
# DE40 = GER40.cash
# The table is for the call on the command line only. A request through pipwerk relay names the
# symbol itself.

# --- The connection to pipwerk relay -------------------------------------------------------------
# Only "pipwerk-fetch-mt5 serve" (on the machine of MetaTrader 5) and "pipwerk-fetch-mt5 request"
# (on the machine that asks) read the sections [relay] and [relay.way]. The call on the command
# line ignores their values. To use them, remove the # of the lines below and fill in the values.
# Every entry that is not named here is rejected. [relay.file_way] does not exist in this version.
# "request" does not need server_time_zone; "serve" does.
#
# [relay]
# The own address of this component: <component>.<pipwerk network>.<relay>. The names are yours;
# the third part is the name of the relay of this machine. A request names the address of the
# machine of MetaTrader 5 (--address), and the answers come back to the address given here.
# address = fetch.net1.relay1
#
# The name of the transmission way. "files" exchanges the messages through two directories.
# way = files
#
# The directory for secrets and the file in it that holds the key of the connection with the
# relay. Create the key with the relay (pipwerk-relay key new) and copy it to this file. On Linux
# only you may reach the directory (mode 700) and the file (mode 600); on Windows only you, the
# system and the administrators.
# secrets_directory = C:\pipwerk\secrets
# key_file = fetch.key
#
# The file in which the connection keeps the messages it has seen and the confirmations it
# waits for. It belongs on a drive of this machine, not on a network drive. Its directory is
# created if it is missing.
# database = C:\pipwerk\state\fetch.db
#
# Optional. The name of the relay side of the connection, <network>.<relay>. Default: the
# network and the relay of the address.
# relay_link = net1.relay1
#
# Optional. How often, in seconds, the inbox is read (1 to 3600). Default 2.
# poll_interval_seconds = 2
#
# [relay.way]
# The own settings of the way, handed over unchanged; the way checks them and rejects what it
# does not know. Every entry begins with "target." (where the relay reads what this component
# sends) or "inbox." (where the relay puts what is meant for this component). The way "files"
# knows "directory" and the limits max_envelope_bytes and max_attachment_bytes.
# target.directory = C:\pipwerk\relay\from-fetch
# inbox.directory = C:\pipwerk\relay\to-fetch
