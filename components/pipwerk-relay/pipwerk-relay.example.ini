# Startup configuration of pipwerk-relay (example).
#
# Copy this file under the name pipwerk-relay.ini to one of the places below and fill in the
# required entries (marked "required"). The relay uses exactly one file; it takes the first one
# it finds in this order, or the one given with -c <PATH>:
#
#   -c <PATH>                                   (highest priority)
#   %USERPROFILE%\pipwerk\etc                   (Windows)
#   %APPDATA%\pipwerk
#   %PROGRAMDATA%\pipwerk
#
#   $HOME/pipwerk/etc                           (Linux)
#   $HOME/.config/pipwerk
#   /etc/pipwerk
#
# This file says where the relay keeps its data. What the relay does (its name, inboxes,
# connected components, address book, periods and limits) is the operating configuration: a JSON
# file that you load with "pipwerk-relay config load <FILE>" (see
# contracts/messages/v1/examples/relay-config.json). The relay opens no port.
#
# The filled-in file names the database and the directories of this machine and may hold a
# password in the database URL: keep it in a place that only you can read, and never put it into
# a repository. Lines that begin with # or ; are comments; a comment must stand on its own line.
# Relative paths are read from the folder in which you call the relay.

[database]
# required. The connection to the database as a URL of SQLAlchemy. A file of SQLite lies on a
# local disk of this machine, not on a network drive. Linux: sqlite:////var/lib/pipwerk-relay/relay.db
# (four slashes: three of the URL and one of the path). Windows: sqlite:///C:/pipwerk-relay/relay.db
url =

[storage]
# required. The directory in which the relay keeps the attachments of the messages in its queue.
# The relay creates it if it does not exist. Plan for space as large as you allow in
# "max_attachment_storage_bytes" of the operating configuration (default 10 GiB).
attachments_directory =

[secrets]
# required. The directory for secrets: the key files of the connections. Only your user may
# read it: on Linux the directory has the rights 700 and every file in it 600 or 400; on
# Windows only your user, the system and the administrators have access. The relay does not
# start otherwise. Create the keys with "pipwerk-relay key new <FILE>".
directory =

[log]
# Optional. The lowest level that is written: DEBUG, INFO, WARNING or ERROR. Default INFO.
# level = INFO
#
# Optional. The log file (appended to, never shortened). Without it the log goes to the
# standard error output. The log names ids, kinds, addresses, ways and results of messages,
# never their content, files or keys.
# file =
