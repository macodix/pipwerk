# Startup configuration of the probe of pipwerk-relay (example).
#
# The probe ("pipwerk-relay probe listen" and "pipwerk-relay probe send") is a component of
# pipwerk relay with an address, a key and a connection to its relay. This file states that
# connection, in the form every component uses (compare pipwerk-fetch-mt5.example.ini). Copy it
# under the name pipwerk-relay-probe.ini, fill in the values and give it to the probe with
# -c <PATH> after the action:
#
#   pipwerk-relay probe listen -c pipwerk-relay-probe.ini -o <DIRECTORY>
#   pipwerk-relay probe send   -c pipwerk-relay-probe.ini --address <ADDRESS> --text <TEXT>
#
# Without -c the probe searches the places below for the file pipwerk-relay-probe.ini and uses
# the first one it finds:
#
#   %USERPROFILE%\pipwerk\etc                   (Windows)
#   %APPDATA%\pipwerk
#   %PROGRAMDATA%\pipwerk
#
#   $HOME/pipwerk/etc                           (Linux)
#   $HOME/.config/pipwerk
#   /etc/pipwerk
#
# The probe opens no port. Every entry that is not named here is rejected, and so is every other
# section. Lines that begin with # or ; are comments; a comment must stand on its own line.
# Use one file for "listen" and another one for "send": each has an address of its own and a
# database of its own.

[relay]
# required. The own address of the probe: <name>.<network>.<relay>. The name is the one of the
# component in the operating configuration of the relay (entry "components"), the network and the
# relay are those of that relay.
address = send.net1.relay1

# required. The transmission way between the probe and its relay. "files" means directories.
way = files

# required. The directory for secrets with the key of the connection between the probe and its
# relay. Only your user may read it (Linux: rights 700 for the directory and 600 for the file;
# Windows: only your user, the system and the administrators have access); the probe does not
# start otherwise.
secrets_directory = /var/lib/pipwerk-relay-probe/secrets

# required. The name of the file with the key in that directory. You get the key from the relay
# ("pipwerk-relay key new <FILE>") by a safe way.
key_file = comp-send

# required. The file in which the probe notes what it has seen and which receipts it waits for.
# Its directory is created. A local disk of this machine, not a network drive.
database = /var/lib/pipwerk-relay-probe/state/send.db

# Optional. <network>.<relay> of the relay side of the connection, if it is not the relay of the
# address.
# relay_link = net1.relay1

# Optional. How often the probe reads its inbox, in seconds, from 1 to 3600. Default 2.
# poll_interval_seconds = 2

[relay.way]
# The settings of the way, passed on as they stand. With "files": the directory the relay reads
# what the probe sends (target.directory), and the directory the relay puts what is meant for the
# probe (inbox.directory). They are directories of the relay (its input for components, and the
# output of the entry of the probe in its operating configuration).
target.directory = /var/lib/pipwerk-relay/in
inbox.directory = /var/lib/pipwerk-relay/out-send
