[project]
name = "pipwerk-relay"
version = "0.1.0.dev0"
description = "pipwerk relay: forwards messages between components and between relays"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "pipwerk-relaycore==0.1.0",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.5",
]

[project.scripts]
pipwerk-relay = "pipwerk_relay.cli:main"
pipwerk-relay-schemas = "pipwerk_relay.schemas:main"

[tool.uv.sources]
pipwerk-relaycore = { path = "../../packages/relay-core", editable = true }

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipwerk_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The replica of the package MetaTrader5 for the test environment has the name of the package
"scripts/replica/MetaTrader5.py" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
